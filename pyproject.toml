[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wechat-tui"
version = "0.1.0"
description = "A TUI (Terminal User Interface) WeChat client"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Qiqi" }
]
keywords = ["wechat", "tui", "terminal", "chat"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]

dependencies = [
    "itchat>=1.3.10",
    "textual>=0.47.0",
    "rich>=13.7.0",
    "httpx>=0.25.0",
    "pillow>=10.0.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
wechat-tui = "wechat_tui.main:main"

[project.urls]
Homepage = "https://github.com/qiqi/wechat-tui"
Repository = "https://github.com/qiqi/wechat-tui"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true